<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">컬러 네거티브 필름층 단순 배열</title>
  <desc id="desc">빛이 들어오는 방향에서 청색, 녹색, 적색 감광층과 필름 베이스가 차례로 놓인 구조도.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <text x="360" y="38" font-family="sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">컬러 네거티브 필름 단순 구조</text>
  <text x="95" y="90" font-family="sans-serif" font-size="20" fill="#111827" text-anchor="middle">빛 입사</text>
  <path d="M95 105v205" stroke="#111827" stroke-width="3"/>
  <path d="M95 316l-10 -18h20z" fill="#111827"/>
  <rect x="190" y="78" width="390" height="66" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="190" y="148" width="390" height="66" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="190" y="218" width="390" height="66" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <rect x="190" y="288" width="390" height="72" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="385" y="119" font-family="sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">청색 감광층</text>
  <text x="385" y="189" font-family="sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">녹색 감광층</text>
  <text x="385" y="259" font-family="sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">적색 감광층</text>
  <text x="385" y="333" font-family="sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">필름 베이스</text>
  <text x="360" y="393" font-family="sans-serif" font-size="18" fill="#475569" text-anchor="middle">교육용 단순도식: 실제 필름에는 필터층과 중간층이 더해질 수 있다.</text>
</svg>
