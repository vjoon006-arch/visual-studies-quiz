<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">35mm 필름 프레임 크기</title>
  <desc id="desc">가로 36밀리미터, 세로 24밀리미터인 35밀리미터 스틸 사진 프레임 도식.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <text x="360" y="42" font-family="sans-serif" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">35mm 스틸 프레임</text>
  <rect x="170" y="110" width="380" height="253" rx="4" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <line x1="170" y1="382" x2="550" y2="382" stroke="#111827" stroke-width="2"/>
  <path d="M170 382l14 -8v16z" fill="#111827"/>
  <path d="M550 382l-14 -8v16z" fill="#111827"/>
  <text x="360" y="407" font-family="sans-serif" font-size="23" font-weight="700" fill="#111827" text-anchor="middle">36mm</text>
  <line x1="135" y1="110" x2="135" y2="363" stroke="#111827" stroke-width="2"/>
  <path d="M135 110l-8 14h16z" fill="#111827"/>
  <path d="M135 363l-8 -14h16z" fill="#111827"/>
  <text x="92" y="242" font-family="sans-serif" font-size="23" font-weight="700" fill="#111827" text-anchor="middle" transform="rotate(-90 92 242)">24mm</text>
  <text x="360" y="238" font-family="sans-serif" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">24 × 36mm</text>
  <text x="360" y="78" font-family="sans-serif" font-size="18" fill="#475569" text-anchor="middle">일반적인 135 필름 한 컷 규격</text>
</svg>
